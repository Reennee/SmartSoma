version: "3.9"

# ─── SmartSoma — Local Development Stack ────────────────────────────────────
# Usage:
#   docker compose up --build
#
# Services:
#   api  — FastAPI backend on http://localhost:8000
#   db   — PostgreSQL (mirrors Railway production setup)
#
# The api service uses DATABASE_URL pointing at the `db` service.
# For SQLite-only local dev (no Docker), just run `uvicorn backend.main:app --reload`

services:

  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: smartsoma
      POSTGRES_PASSWORD: smartsoma_dev_pw
      POSTGRES_DB: smartsoma
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartsoma"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Overrides whatever is in backend/.env
      DATABASE_URL: postgresql://smartsoma:smartsoma_dev_pw@db:5432/smartsoma
      SECRET_KEY: docker-compose-dev-secret-change-in-production
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "480"
      CORS_ORIGINS: "http://localhost:3000"
      MODEL_PATH: /app/models/bilstm_dkt_model.pth
      ENVIRONMENT: development
    ports:
      - "8000:8000"
    volumes:
      # Hot-reload for development (remove for production)
      - ./backend:/app/backend
      - ./data:/app/data

volumes:
  postgres_data:
